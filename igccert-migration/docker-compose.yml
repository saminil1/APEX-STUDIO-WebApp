# igccert.org — Mac 로컬 Docker 복원 환경
# 구성: Apache+PHP(web) / MariaDB(db) / phpMyAdmin(pma) / Cloudflare Tunnel(tunnel, 선택)
# 사용법: README.md 참고  (./scripts/restore.sh <백업경로> → docker compose up -d)

name: igccert

services:
  web:
    build:
      context: ./docker
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: igccert-web:local
    container_name: igccert-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-igccert.org}
      DOCROOT_SUBDIR: ${DOCROOT_SUBDIR:-}
    volumes:
      - ./site:/var/www/html
      - ./certs:/etc/apache2/certs:ro
      - ./logs/apache:/var/log/apache2

  db:
    image: mariadb:${MARIADB_VERSION:-10.11}
    container_name: igccert-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 설정하세요}
      MARIADB_DATABASE: ${DB_NAME:-igccert}
      MARIADB_USER: ${DB_USER:-igccert}
      MARIADB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=512M
    volumes:
      - db_data:/var/lib/mysql
      # 최초 1회(볼륨이 비어 있을 때)만 *.sql / *.sql.gz 자동 import
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  pma:
    image: phpmyadmin:5
    container_name: igccert-pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"

  # 선택: Mac 로컬 서버를 인터넷에 공개 (docker compose --profile tunnel up -d)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: igccert-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - web
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  db_data:
