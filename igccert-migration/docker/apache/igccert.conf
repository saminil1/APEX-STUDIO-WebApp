# igccert.org 가상호스트 (APACHE_DOCROOT / SITE_DOMAIN 은 entrypoint 에서 환경변수로 주입)
ServerName localhost

<VirtualHost *:80>
    ServerName ${SITE_DOMAIN}
    ServerAlias www.${SITE_DOMAIN} localhost
    DocumentRoot ${APACHE_DOCROOT}

    <Directory ${APACHE_DOCROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# 인증서(certs/<도메인>.pem, certs/<도메인>-key.pem)가 있을 때만 HTTPS 활성화
<IfFile "/etc/apache2/certs/${SITE_DOMAIN}.pem">
<VirtualHost *:443>
    ServerName ${SITE_DOMAIN}
    ServerAlias www.${SITE_DOMAIN} localhost
    DocumentRoot ${APACHE_DOCROOT}

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/${SITE_DOMAIN}.pem
    SSLCertificateKeyFile /etc/apache2/certs/${SITE_DOMAIN}-key.pem

    <Directory ${APACHE_DOCROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
</IfFile>
